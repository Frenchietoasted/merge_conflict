<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Task Tracker - Developer Beta</title>
        <link rel="stylesheet" href="style.css" />
    </head>
    <body>
        <div class="container">
            <header class="app-header">
                <h1 id="app-title">Task Tracker [Dev Beta 2.0]</h1>
                <p id="app-subtitle">
                    Experimental playground for cutting-edge features
                </p>
            </header>

            <main>
                <form id="task-form">
                    <input
                        type="text"
                        id="task-input"
                        placeholder="Enter an experimental dev task..."
                        required
                    />
                    <button type="submit" id="add-btn">Add Task</button>
                </form>

                <div class="action-bar">
                    <span id="task-count">0 tasks left</span>
                    <button id="action-btn" class="btn secondary">
                        Delete Completed Tasks
                    </button>
                </div>

                <ul id="task-list"></ul>
            </main>
        </div>
        <script src="app.js"></script>
    </body>
</html>
